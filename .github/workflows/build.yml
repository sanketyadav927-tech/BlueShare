name: Build BlueShare .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build BlueShare
    runs-on: macos-latest

    env:
      THEOS: /opt/theos

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Allow writing to /opt (don't create /opt/theos yet — git clone will) 
      - name: Allow writes to /opt
        run: sudo chmod 777 /opt

      # ── 3. Cache Theos ────────────────────────────────────────────────────────
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: theos-clone-${{ runner.arch }}-v6

      # ── 4. Clone Theos (git clone creates /opt/theos itself) ─────────────────
      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            /opt/theos
          mkdir -p /opt/theos/sdks

      # ── 5. Download iOS SDK via gh CLI ───────────────────────────────────────
      - name: Download iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/sdks
          gh release download \
            --repo theos/sdks \
            --pattern "iPhoneOS*.sdk.tar.xz" \
            --dir /tmp/sdks/
          for f in /tmp/sdks/*.tar.xz; do
            echo "Extracting $f"
            tar -xJf "$f" -C /opt/theos/sdks/
          done
          echo "Installed SDKs:"
          ls /opt/theos/sdks/

      # ── 6. Install ldid ───────────────────────────────────────────────────────
      - name: Install ldid
        run: brew install ldid

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1

      # ── 8. Show output ────────────────────────────────────────────────────────
      - name: List packages
        run: ls -lh packages/

      # ── 9. Upload artifact ────────────────────────────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BlueShare-deb
          path: packages/*.deb
          retention-days: 30

      # ── 10. GitHub Release on version tags ────────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          name: BlueShare ${{ github.ref_name }}
          body: |
            ## BlueShare ${{ github.ref_name }}
            **by Sanket Yadav**
            ### Install
            ```bash
            scp BlueShare*.deb root@<device-ip>:/var/root/
            ssh root@<device-ip> "dpkg -i /var/root/BlueShare*.deb && killall SpringBoard"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
