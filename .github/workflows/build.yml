name: Build BlueShare .deb

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build with Theos
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Official Theos setup action ──────────────────────────────────────
      # This handles EVERYTHING: installs Theos, downloads the correct iOS SDK,
      # sets up ldid, and exports $THEOS — no manual SDK URL needed.
      - name: Setup Theos
        uses: theos/theos-action@v2
        with:
          sdk-version: '16.5'      # iOS SDK version to download
          theos-version: 'latest'  # always use latest Theos

      # ── 3. Build the .deb package ────────────────────────────────────────────
      - name: Build BlueShare
        run: |
          make clean
          make package FINALPACKAGE=1

      # ── 4. List output ──────────────────────────────────────────────────────
      - name: Show built packages
        run: ls -lh packages/

      # ── 5. Upload .deb as downloadable artifact ─────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: BlueShare-deb
          path: packages/*.deb
          retention-days: 30

      # ── 6. Create GitHub Release on version tags (e.g. git tag v1.0.0) ──────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          name: BlueShare ${{ github.ref_name }}
          body: |
            ## BlueShare ${{ github.ref_name }}
            **by Sanket Yadav**

            ### Install
            ```bash
            scp BlueShare*.deb root@<device-ip>:/var/root/
            ssh root@<device-ip> "dpkg -i /var/root/BlueShare*.deb && killall SpringBoard"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
